name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_labs.py
